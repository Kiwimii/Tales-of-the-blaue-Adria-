name: Repair world v13 syntax

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-world-v13.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repair missing object brace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/world-v13.js')
          text = path.read_text(encoding='utf-8')
          old = "E.advance(15,'Botanische Feldforschung')}} ,{label:"
          new = "E.advance(15,'Botanische Feldforschung')}}},{label:"
          if old not in text:
              raise SystemExit('Expected broken sequence not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate all game modules
        run: |
          node --check docs/content-v13.js
          node --check docs/map-v13.js
          node --check docs/prelude-v13.js
          node --check docs/engine-v13.js
          node --check docs/bridge-v13.js
          node --check docs/world-v13.js
          node --check docs/activities-v13.js
          node --check docs/hotfix-v13.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/world-v13.js
          git commit -m "fix: close smoke dialogue option object"
          git push origin main

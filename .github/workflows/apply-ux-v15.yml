name: Apply UX v15 integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ux-v15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch world, page and validation
        run: |
          python - <<'PY'
          from pathlib import Path

          world = Path('docs/world-v13.js')
          text = world.read_text(encoding='utf-8')
          old_draw = "drawTerrain();drawRoads();drawZones();drawProps();drawWaterDetails(t);drawNPCs(t);drawPlayer(t);drawParticles();ctx.restore();drawAtmosphere(t);drawWorldUI();"
          new_draw = "drawTerrain();E.visuals?.drawGround?.(t);drawRoads();drawZones();drawProps();E.visuals?.drawProps?.(t);drawWaterDetails(t);drawNPCs(t);drawPlayer(t);E.visuals?.drawForeground?.(t);drawParticles();ctx.restore();drawAtmosphere(t);"
          if old_draw not in text:
              raise SystemExit('World draw sequence not found')
          text = text.replace(old_draw, new_draw, 1)
          old_say = "function say(text){R.message=text;R.messageUntil=performance.now()+3800;}"
          new_say = "function say(text){E.toast('Campingplatz',text);R.message='';R.messageUntil=0;}"
          if old_say not in text:
              raise SystemExit('World say function not found')
          world.write_text(text.replace(old_say, new_say, 1), encoding='utf-8')

          index = Path('docs/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('./manifest.webmanifest?v=13','./manifest.webmanifest?v=15')
          html = html.replace('./styles.css?v=13','./styles.css?v=15')
          html = html.replace('./styles-v13.css?v=13','./styles-v13.css?v=15')
          if 'ux-v15.css' not in html:
              html = html.replace('<link rel="stylesheet" href="./styles-v13.css?v=15" />','<link rel="stylesheet" href="./styles-v13.css?v=15" />\n  <link rel="stylesheet" href="./ux-v15.css?v=15" />')
          html = html.replace('?v=14','?v=15')
          if 'ux-v15.js' not in html:
              html = html.replace('<script src="./hotfix-v13.js?v=15"></script>','<script src="./hotfix-v13.js?v=15"></script>\n  <script src="./ux-v15.js?v=15"></script>')
          index.write_text(html, encoding='utf-8')

          content = Path('docs/content-v13.js')
          c = content.read_text(encoding='utf-8')
          c = c.replace("version:'1.3.0-sprint10'", "version:'1.5.0-sprint16'", 1)
          c = c.replace("build:'Sprint 10 · v1.3.0'", "build:'Sprint 16 · v1.5.0'", 1)
          content.write_text(c, encoding='utf-8')

          manifest = Path('docs/manifest.webmanifest')
          m = manifest.read_text(encoding='utf-8').replace('./?v=13','./?v=15')
          manifest.write_text(m, encoding='utf-8')

          workflow = Path('.github/workflows/validate-v13.yml')
          v = workflow.read_text(encoding='utf-8')
          if 'node --check docs/ux-v15.js' not in v:
              v = v.replace('node --check docs/hotfix-v13.js','node --check docs/hotfix-v13.js\n          node --check docs/ux-v15.js')
          if "grep -q 'ux-v15.js' docs/index.html" not in v:
              v = v.replace("grep -q 'hotfix-v13.js' docs/index.html", "grep -q 'hotfix-v13.js' docs/index.html\n          grep -q 'ux-v15.js' docs/index.html\n          grep -q 'ux-v15.css' docs/index.html")
          v = v.replace("Sprint 10 · v1.3.0", "Sprint 16 · v1.5.0")
          workflow.write_text(v, encoding='utf-8')
          PY
      - name: Validate integrated build
        run: |
          node --check docs/content-v13.js
          node --check docs/map-v13.js
          node --check docs/prelude-v13.js
          node --check docs/engine-v13.js
          node --check docs/bridge-v13.js
          node --check docs/world-v13.js
          node --check docs/activities-v13.js
          node --check docs/hotfix-v13.js
          node --check docs/ux-v15.js
          grep -q 'ux-v15.css' docs/index.html
          grep -q 'ux-v15.js' docs/index.html
          grep -q 'Sprint 16 · v1.5.0' docs/content-v13.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/validate-v13.yml
          git commit -m "sprint 16: integrate close camera, natural collisions and compact dialogue UX"
          git push origin main

# trigger integration

name: Validate game build

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/validate-v13.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/validate-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax · legacy game modules
        run: |
          node --check docs/content-v13.js
          node --check docs/map-v13.js
          node --check docs/prelude-v13.js
          node --check docs/engine-v13.js
          node --check docs/bridge-v13.js
          node --check docs/world-v13.js
          node --check docs/activities-v13.js
          node --check docs/hotfix-v13.js
          node --check docs/ux-v15.js
          node --check docs/ux-runtime-v15.js
      - name: Syntax · professional design and expansion modules
        run: |
          node --check docs/design-core-v23.js
          node --check docs/design-world-v23.js
          node --check docs/design-characters-v23.js
          node --check docs/design-battle-v23.js
          node --check docs/design-minigames-v23.js
          node --check docs/design-atmosphere-v23.js
          node --check docs/design-runtime-v23.js
          node --check docs/expansion-v25.js
          node --check docs/expansion-v28.js
      - name: Check required page elements
        run: |
          for id in boot-screen boot-status boot-progress app game-canvas game-stage needs-strip touch-controls virtual-stick stick-knob action-button scene-actions toast-stack objective-banner creator-screen shop-screen dialogue-layer drawer-layer fatal-error; do
            grep -q "id=\"$id\"" docs/index.html || { echo "Missing #$id"; exit 1; }
          done
      - name: Check Sprint 28 assets and order
        run: |
          grep -q 'design-v23.css?v=28' docs/index.html
          grep -q 'design-faces-v23.css?v=28' docs/index.html
          grep -q 'expansion-v25.css?v=28' docs/index.html
          grep -q 'expansion-v28.css?v=28' docs/index.html
          grep -q 'design-core-v23.js?v=28' docs/index.html
          grep -q 'design-runtime-v23.js?v=28' docs/index.html
          grep -q 'expansion-v25.js?v=28' docs/index.html
          grep -q 'expansion-v28.js?v=28' docs/index.html
          grep -q '"start_url": "./?v=28"' docs/manifest.webmanifest
          grep -q 'Sprint 28 · v1.8.0' docs/SPRINTS-21-28.md
      - name: Check forbidden stale runtime
        run: |
          ! grep -q 'game.js?v=8' docs/index.html
          ! grep -q 'content.js?v=8' docs/index.html
          ! grep -q '?v=14' docs/index.html

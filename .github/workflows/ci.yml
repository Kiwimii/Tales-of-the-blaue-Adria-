name: Validate game and migration build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run complete validation and build all browser variants
        run: npm run check > validation.log 2>&1
      - name: Upload failed validation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-log
          path: validation.log
          retention-days: 2
      - name: Upload validated LPC browser build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lpc-main-browser-build
          path: docs/lpc-main
          retention-days: 2
          if-no-files-found: error
      - name: Commit validated browser builds
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/next docs/redesign docs/lpc-test docs/lpc-main
          if git diff --cached --quiet; then
            echo "Browser builds already current."
          else
            git commit -m "Publish current browser builds"
            git push
          fi
